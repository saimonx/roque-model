<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roque Night Forecast</title>
  <meta name="description" content="Forecast of tonight's observing conditions at the Roque de los Muchachos Observatory (La Palma): dome-closure risk, seeing and hours lost to weather. Independent project with real, public data.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div>
        <h1>Roque Night Forecast</h1>
        <p class="sub" data-i18n="subtitle"></p>
      </div>
      <div class="controls">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="es">ES</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="theme" id="theme" data-i18n-title="theme" aria-label="theme">◐</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p class="notice" data-i18n="independent"></p>

    <!-- Tonight -->
    <section id="tonight">
      <div class="section-head">
        <h2 id="night-title"></h2>
        <span id="mode" class="badge"></span>
      </div>
      <p class="muted" id="night-window"></p>
      <p class="muted small" id="mode-note"></p>
      <div class="cards">
        <article class="card" id="card-closure">
          <h3 data-i18n="closure_title"></h3>
          <div class="big"><span id="p-closed"></span></div>
          <div id="risk" class="status"></div>
          <div class="meter" aria-hidden="true"><div id="meter-fill"></div><div id="meter-clim"></div></div>
          <p class="muted small" id="closure-ref"></p>
          <p class="small" id="closed-hours"></p>
        </article>
        <article class="card">
          <h3 data-i18n="seeing_title"></h3>
          <div class="big"><span id="seeing"></span></div>
          <div id="seeing-class" class="status"></div>
          <p class="muted small" id="seeing-ref"></p>
          <p class="muted small" data-i18n="seeing_help"></p>
        </article>
        <article class="card">
          <h3 data-i18n="lost_title"></h3>
          <div class="big"><span id="lost"></span></div>
          <p class="muted small" id="lost-of"></p>
          <p class="muted small" id="lost-ref"></p>
          <p class="muted small" data-i18n="lost_help"></p>
        </article>
      </div>
      <div class="moon" id="moon">
        <svg id="moon-icon" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"></svg>
        <div>
          <p id="moon-text"></p>
          <p class="muted small" data-i18n="moon_help"></p>
        </div>
      </div>
    </section>

    <section>
      <h2 data-i18n="why_title"></h2>
      <p class="muted" data-i18n="why_text"></p>
      <dl class="inputs" id="inputs"></dl>
      <div class="two">
        <div>
          <h3 data-i18n="importance_closure"></h3>
          <div class="chart bars" id="chart-imp-closure"></div>
        </div>
        <div>
          <h3 data-i18n="importance_seeing"></h3>
          <div class="chart bars" id="chart-imp-seeing"></div>
        </div>
      </div>
      <p class="muted small" data-i18n="importance_text"></p>
    </section>

    <section>
      <h2 data-i18n="hourly_title"></h2>
      <p class="muted small" data-i18n="hourly_text"></p>
      <div class="chart" id="chart-hourly-rh"></div>
      <div class="chart short" id="chart-hourly-wind"></div>
    </section>

    <section>
      <h2 data-i18n="station_title"></h2>
      <p class="muted small" id="station-text"></p>
      <div class="chart" id="chart-station"></div>
      <div id="gtc-panel"></div>
    </section>

    <!-- Evidence -->
    <section>
      <h2 data-i18n="eval_title"></h2>
      <p class="muted" data-i18n="eval_text"></p>

      <h3 data-i18n="eval_closure"></h3>
      <div class="chart bars" id="chart-skill"></div>
      <div class="table-wrap"><table id="table-closure"></table></div>

      <h3 data-i18n="eval_reliability"></h3>
      <p class="muted small" id="reliability-text"></p>
      <div class="chart square" id="chart-reliability"></div>

      <h3 data-i18n="eval_recent"></h3>
      <p class="muted small" data-i18n="eval_recent_text"></p>
      <div class="chart" id="chart-recent"></div>

      <h3 data-i18n="eval_seeing"></h3>
      <div class="chart" id="chart-seeing"></div>
      <div class="table-wrap"><table id="table-seeing"></table></div>

      <h3 data-i18n="eval_lost"></h3>
      <p class="muted small" data-i18n="eval_lost_text"></p>
      <div class="table-wrap"><table id="table-lost"></table></div>

      <h3 data-i18n="track_title"></h3>
      <p class="muted small" data-i18n="track_text"></p>
      <div class="table-wrap"><table id="table-track"></table></div>
    </section>

    <section>
      <h2 data-i18n="how_title"></h2>
      <ol class="flow" id="flow"></ol>
      <div class="prose" data-i18n-html="how_text"></div>
    </section>

    <section>
      <h2 data-i18n="sources_title"></h2>
      <div class="prose" data-i18n-html="sources_text"></div>
    </section>
  </main>

  <footer class="wrap foot">
    <p id="updated" class="muted small"></p>
    <p class="muted small" data-i18n="footer"></p>
  </footer>

  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <script src="assets/i18n.js"></script>
  <script src="assets/charts.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
