<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roque Night Forecast</title>
  <meta name="description" content="Forecast of tonight's observing conditions at the Roque de los Muchachos Observatory (La Palma), hour by hour: dome-closure risk, seeing and warnings. Independent project with real, public data.">
  <link rel="stylesheet" href="assets/style.css?v=4">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div>
        <h1>Roque Night Forecast</h1>
        <p class="sub" data-i18n="subtitle"></p>
      </div>
      <div class="controls">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="es">ES</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="theme" id="theme" data-i18n-title="theme" aria-label="theme">◐</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p class="notice" data-i18n="independent"></p>

    <!-- 1. Tonight in a few numbers -->
    <section id="tonight">
      <div class="section-head">
        <h2 id="night-title"></h2>
        <span id="mode" class="badge"></span>
      </div>
      <p class="muted small" id="night-window"></p>
      <div class="tiles">
        <div class="tile">
          <span class="tile-label" data-i18n="tile_closed"></span>
          <span class="tile-value" id="closed-h"></span>
          <span id="risk" class="status small"></span>
          <span class="muted small" id="closure-ref"></span>
        </div>
        <div class="tile">
          <span class="tile-label" data-i18n="tile_lost"></span>
          <span class="tile-value" id="lost"></span>
          <span class="muted small" id="lost-of"></span>
          <span class="muted small" id="lost-ref"></span>
        </div>
        <div class="tile">
          <span class="tile-label" data-i18n="tile_sky"></span>
          <span class="tile-value" id="sky"></span>
          <span id="sky-word" class="status small"></span>
          <span class="muted small" data-i18n="tile_sky_help"></span>
        </div>
        <div class="tile">
          <span class="tile-label" data-i18n="tile_seeing"></span>
          <span class="tile-value" id="seeing"></span>
          <div class="scale" id="seeing-scale" aria-hidden="true"><div class="scale-bar"></div><div class="scale-mark" id="seeing-mark"></div></div>
          <span class="scale-ends small muted"><span>0,4″</span><span id="seeing-class-word"></span><span>2″</span></span>
          <span class="muted small" id="seeing-ref"></span>
        </div>
        <div class="tile">
          <span class="tile-label" data-i18n="tile_moon"></span>
          <span class="tile-value moon-value"><svg id="moon-icon" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"></svg><span id="moon-pct"></span></span>
          <span class="muted small" id="moon-text"></span>
        </div>
      </div>
      <p class="summary" id="summary"></p>
    </section>

    <!-- 2. Hour by hour -->
    <section id="hours-section">
      <h2 data-i18n="hours_title"></h2>
      <p class="muted small" data-i18n-html="hours_text"></p>
      <div class="table-wrap"><table id="hours" class="hours"></table></div>
      <details class="more small">
        <summary data-i18n="warnings_more"></summary>
        <div data-i18n-html="warnings_text"></div>
      </details>
    </section>

    <!-- 3. How it works, in three lines -->
    <section>
      <h2 data-i18n="how_title"></h2>
      <ol class="steps" data-i18n-html="how_short"></ol>
      <p class="muted small" data-i18n="how_note"></p>
    </section>

    <!-- Everything else, folded -->
    <details class="fold">
      <summary><h2 data-i18n="data_title"></h2></summary>
      <p class="muted" data-i18n="data_intro"></p>
      <div class="data" data-i18n-html="data_html"></div>
    </details>

    <details class="fold">
      <summary><h2 data-i18n="fold_eval"></h2></summary>
      <p class="muted" data-i18n="eval_text"></p>

      <h3 data-i18n="eval_hourly"></h3>
      <p class="muted small" data-i18n="eval_hourly_text"></p>
      <div class="table-wrap"><table id="table-hourly" class="text"></table></div>

      <h3 data-i18n="eval_lt"></h3>
      <p class="muted small" data-i18n="eval_lt_text"></p>
      <div class="table-wrap"><table id="table-lt"></table></div>

      <h3 data-i18n="eval_sky"></h3>
      <p class="muted small" data-i18n="eval_sky_text"></p>
      <div class="table-wrap"><table id="table-sky"></table></div>

      <h3 data-i18n="eval_dust"></h3>
      <p class="muted small" data-i18n="eval_dust_text"></p>
      <div class="table-wrap"><table id="table-dust" class="text"></table></div>

      <h3 data-i18n="eval_closure"></h3>
      <div class="chart bars" id="chart-skill"></div>
      <div class="table-wrap"><table id="table-closure"></table></div>

      <h3 data-i18n="eval_reliability"></h3>
      <p class="muted small" id="reliability-text"></p>
      <div class="chart square" id="chart-reliability"></div>

      <h3 data-i18n="eval_recent"></h3>
      <p class="muted small" data-i18n="eval_recent_text"></p>
      <div class="chart" id="chart-recent"></div>

      <h3 data-i18n="eval_seeing"></h3>
      <div class="chart" id="chart-seeing"></div>
      <div class="table-wrap"><table id="table-seeing"></table></div>

      <h3 data-i18n="eval_lost"></h3>
      <p class="muted small" data-i18n="eval_lost_text"></p>
      <div class="table-wrap"><table id="table-lost"></table></div>

      <h3 data-i18n="track_title"></h3>
      <p class="muted small" data-i18n="track_text"></p>
      <div class="table-wrap"><table id="table-track"></table></div>
    </details>

    <details class="fold">
      <summary><h2 data-i18n="fold_model"></h2></summary>
      <ol class="flow" id="flow"></ol>
      <div class="prose" data-i18n-html="how_text"></div>
      <h3 data-i18n="why_title"></h3>
      <p class="muted small" id="mode-note"></p>
      <dl class="inputs" id="inputs"></dl>
      <div class="two">
        <div>
          <h3 data-i18n="importance_closure"></h3>
          <div class="chart bars" id="chart-imp-closure"></div>
        </div>
        <div>
          <h3 data-i18n="importance_seeing"></h3>
          <div class="chart bars" id="chart-imp-seeing"></div>
        </div>
      </div>
      <p class="muted small" data-i18n="importance_text"></p>
    </details>

    <details class="fold">
      <summary><h2 data-i18n="fold_live"></h2></summary>
      <h3 data-i18n="hourly_title"></h3>
      <p class="muted small" data-i18n="hourly_text"></p>
      <div class="chart" id="chart-hourly-rh"></div>
      <div class="chart short" id="chart-hourly-wind"></div>
      <h3 data-i18n="station_title"></h3>
      <p class="muted small" id="station-text"></p>
      <div class="chart" id="chart-station"></div>
      <div id="gtc-panel"></div>
    </details>

    <details class="fold">
      <summary><h2 data-i18n="sources_title"></h2></summary>
      <div class="prose" data-i18n-html="sources_text"></div>
    </details>
  </main>

  <footer class="wrap foot">
    <p id="updated" class="muted small"></p>
    <p class="muted small" data-i18n="footer"></p>
  </footer>

  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <script src="assets/i18n.js?v=4"></script>
  <script src="assets/charts.js?v=4"></script>
  <script src="assets/app.js?v=4"></script>
</body>
</html>
