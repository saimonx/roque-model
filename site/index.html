<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoqueModel</title>
  <meta name="description" content="RoqueModel: previsión hora a hora de si la cúpula podrá estar abierta para observar esta noche en el Observatorio del Roque de los Muchachos (La Palma). Proyecto independiente con datos reales y públicos.">
  <link rel="icon" href="assets/favicon-32.png?v=67" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon.svg?v=67" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=67">
  <link rel="stylesheet" href="assets/style.css?v=67">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div>
        <h1 class="brand"><img src="assets/favicon.svg?v=67" alt="" width="34" height="34">RoqueModel</h1>
        <p class="sub" data-i18n="subtitle"></p>
      </div>
      <a class="grafana-link" href="https://saimonx.github.io/roque-model/grafana/" data-i18n="grafana_link" data-i18n-title="grafana_title"></a>
    </div>
  </header>

  <main class="wrap">
    <p class="notice" data-i18n="independent"></p>

    <!-- 1. Tonight: the answer -->
    <section id="tonight">
      <h2 id="night-title"></h2>
      <p class="muted small night-line"><span id="night-window"></span>
        <a class="watch-link" href="#vigilancia"><img class="status-badge" src="https://healthchecks.io/b/2/0437fc28-5880-4f5a-b616-9f2a2ea0c8bb.svg" alt="Estado de la vigilancia" height="18"><span data-i18n="watch_link"></span></a></p>
      <p class="notice stale" id="stale" hidden></p>
      <div class="model-card">
      <p class="line-head"><b data-i18n="line_model"></b></p>
      <div class="mode-box">
        <div class="mode-row"><span class="mode-label" data-i18n="mode_label"></span><ul class="mode-list" id="mode-list"></ul></div>
        <details class="info"><summary data-i18n="mode_why"></summary><p id="mode-text"></p></details>
      </div>
      <div class="lines"><div class="strip" id="strip"></div></div>
      <div class="hour-detail" id="detail-model" hidden></div>
      <div class="color-legend small">
        <h3 data-i18n="legend_title"></h3>
        <div data-i18n-html="legend_model"></div>
      </div>
      </div>

      <p class="line-head"><b data-i18n="line_raw"></b></p>
      <div class="mode-box"><div class="mode-row"><ul class="mode-list" id="raw-list"></ul></div></div>
      <div class="lines"><div class="strip strip-raw" id="strip-raw"></div></div>
      <div class="hour-detail" id="detail-raw" hidden></div>
      <div class="color-legend small">
        <h3 data-i18n="legend_title"></h3>
        <div data-i18n-html="legend_raw"></div>
      </div>

    </section>

    <!-- 2. How RoqueModel works -->
    <section id="roquemodel">
      <h2 data-i18n="rm_title"></h2>
      <div class="rm-parts">
        <details class="rm-part">
          <summary class="rm-head"><span class="rm-num">1</span><h3 data-i18n="rm1_title"></h3><span class="rm-arrow" aria-hidden="true"></span></summary>
          <div class="rm-prose" id="rm1-text"></div>
        </details>
        <details class="rm-part" id="tuning">
          <summary class="rm-head"><span class="rm-num">2</span><h3 data-i18n="tune_title"></h3><span class="rm-arrow" aria-hidden="true"></span></summary>
          <p data-i18n-html="tune_intro"></p>
          <div class="table-wrap"><table class="small rm-table" id="rm-tech"></table></div>
          <p class="muted small" data-i18n-html="rm1_note"></p>
          <h4 data-i18n="rm1_search_title"></h4>
          <p class="small" id="rm1-search-text"></p>
          <div class="settings-grid" id="rm1-settings"></div>
        </details>
        <details class="rm-part">
          <summary class="rm-head"><span class="rm-num">3</span><h3 data-i18n="rm2_title"></h3><span class="rm-arrow" aria-hidden="true"></span></summary>
          <p id="rm2-text"></p>
          <div class="rm-timeline" id="rm-timeline"></div>
          <div class="table-wrap"><table class="small rm-table" id="rm-data"></table></div>
          <p class="muted small" data-i18n-html="rm2_note"></p>
          <p class="data-download" data-i18n-html="rm2_download"></p>
        </details>
        <details class="rm-part">
          <summary class="rm-head"><span class="rm-num">4</span><h3 data-i18n="rm3_title"></h3><span class="rm-arrow" aria-hidden="true"></span></summary>
          <ol class="rm-flow" id="rm-flow"></ol>
          <h4 id="rm-example-title"></h4>
          <ul class="rm-waterfall" id="rm-example"></ul>
          <p class="muted small" id="rm3-note"></p>
        </details>
        <details class="rm-part">
          <summary class="rm-head"><span class="rm-num">5</span><h3 data-i18n="rm4_title"></h3><span class="rm-arrow" aria-hidden="true"></span></summary>
          <p id="rm4-text"></p>
          <div class="rm-timeline" id="rm4-timeline"></div>
          <ul class="rm-bars" id="rm4-bars"></ul>
          <p class="small" data-i18n-html="rm4_download"></p>
        </details>
        <details class="rm-part" id="models">
          <summary class="rm-head"><span class="rm-num">6</span><h3 data-i18n="rm5_title"></h3><span class="rm-arrow" aria-hidden="true"></span></summary>
          <p id="rm5-text"></p>
          <ul class="rm-bars" id="rm5-bars"></ul>
          <div class="table-wrap"><table class="small rm-table" id="rm5-table"></table></div>
          <p class="muted small" id="rm5-note"></p>
          <div class="rm-prose" id="rm5-more"></div>
        </details>
        <details class="rm-part" id="live">
          <summary class="rm-head"><span class="rm-num">7</span><h3 data-i18n="fold_live"></h3><span class="rm-arrow" aria-hidden="true"></span></summary>
          <p data-i18n="live_intro"></p>
          <p class="small" data-i18n-html="live_grafana"></p>
          <h4 data-i18n="live_fc_title"></h4>
          <p class="muted small" data-i18n-html="live_fc_text"></p>
          <div class="mini-grid" id="fc-grid"></div>
          <h4 data-i18n="station_title"></h4>
          <p class="muted small" id="station-text"></p>
          <div class="mini-grid" id="station-grid"></div>
          <h4 data-i18n="vs_title"></h4>
          <p class="muted small" data-i18n="vs_text"></p>
          <div class="chart short" id="chart-vs"></div>
        </details>
        <details class="rm-part" id="notes">
          <summary class="rm-head"><span class="rm-num">8</span><h3 data-i18n="notes_title"></h3><span class="rm-arrow" aria-hidden="true"></span></summary>
          <p class="muted" data-i18n="notes_intro"></p>
          <div class="notes-grid">
            <section class="note-card why"><h4 data-i18n="notes_why_title"></h4><ul data-i18n-html="notes_why"></ul></section>
            <section class="note-card missing"><h4 data-i18n="notes_missing_title"></h4><ul data-i18n-html="notes_missing"></ul></section>
            <section class="note-card limits"><h4 data-i18n="notes_limits_title"></h4><ul data-i18n-html="notes_limits"></ul></section>
            <section class="note-card compute"><h4 data-i18n="notes_compute_title"></h4><ul data-i18n-html="notes_compute"></ul></section>
          </div>
        </details>
        <details class="rm-part" id="refs">
          <summary class="rm-head"><span class="rm-num">9</span><h3 data-i18n="fold_refs"></h3><span class="rm-arrow" aria-hidden="true"></span></summary>
          <ul class="refs" data-i18n-html="refs_html"></ul>
        </details>
      </div>
    </section>

  </main>

  <footer class="wrap foot">
    <p class="muted small" id="vigilancia" data-i18n-html="monitor"></p>
    <p id="updated" class="muted small"></p>
    <p class="muted small" data-i18n-html="footer"></p>
    <p class="muted small" data-i18n-html="credits"></p>
  </footer>

  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <script src="assets/i18n.js?v=67"></script>
  <script src="assets/charts.js?v=67"></script>
  <script src="assets/app.js?v=67"></script>
</body>
</html>
