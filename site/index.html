<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roque Night Forecast</title>
  <meta name="description" content="Tonight at the Roque de los Muchachos Observatory (La Palma), hour by hour: will the dome be open, and how sharp will the stars be. Independent project with real, public data.">
  <link rel="stylesheet" href="assets/style.css?v=32">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div>
        <h1>Roque Night Forecast</h1>
        <p class="sub" data-i18n="subtitle"></p>
      </div>
      <div class="controls">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="es">ES</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="theme" id="theme" data-i18n-title="theme" aria-label="theme">◐</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p class="notice" data-i18n="independent"></p>

    <!-- 1. Tonight: the answer -->
    <section id="tonight">
      <h2 id="night-title"></h2>
      <p class="muted small night-line"><span id="night-window"></span></p>
      <details class="info"><summary id="mode"></summary><p id="mode-text"></p></details>
      <p class="headline" id="headline"></p>
      <div class="lines">
        <p class="line-head"><b data-i18n="line_model"></b> <span class="muted small" id="acc-model"></span></p>
        <div class="strip" id="strip"></div>
        <p class="line-head"><b data-i18n="line_raw"></b> <span class="muted small" id="acc-raw"></span></p>
        <div class="strip strip-raw" id="strip-raw"></div>
      </div>
      <div class="hour-detail" id="hour-detail" hidden></div>
      <p class="muted small" data-i18n-html="strip_legend"></p>
      <p class="muted small" id="acc-note"></p>

    </section>

    <!-- 2. How RoqueModel works -->
    <section id="roquemodel">
      <h2 data-i18n="rm_title"></h2>
      <p class="muted" data-i18n-html="rm_intro"></p>
      <div class="rm-parts">
        <article class="rm-part">
          <header class="rm-head"><span class="rm-num">1</span><h3 data-i18n="rm1_title"></h3></header>
          <p data-i18n-html="rm1_text"></p>
          <div class="rm-stats" id="rm-stats"></div>
          <div class="table-wrap"><table class="small rm-table" id="rm-tech"></table></div>
          <p class="muted small" data-i18n-html="rm1_note"></p>
        </article>
        <article class="rm-part">
          <header class="rm-head"><span class="rm-num">2</span><h3 data-i18n="rm2_title"></h3></header>
          <p id="rm2-text"></p>
          <div class="rm-timeline" id="rm-timeline"></div>
          <div class="table-wrap"><table class="small rm-table" id="rm-data"></table></div>
          <p class="muted small" data-i18n-html="rm2_note"></p>
        </article>
        <article class="rm-part">
          <header class="rm-head"><span class="rm-num">3</span><h3 data-i18n="rm3_title"></h3></header>
          <ol class="rm-flow" id="rm-flow"></ol>
          <h4 id="rm-example-title"></h4>
          <ul class="rm-waterfall" id="rm-example"></ul>
          <p class="muted small" data-i18n-html="rm3_note"></p>
        </article>
        <article class="rm-part">
          <header class="rm-head"><span class="rm-num">4</span><h3 data-i18n="rm4_title"></h3></header>
          <p id="rm4-text"></p>
          <div class="rm-timeline" id="rm4-timeline"></div>
          <ul class="rm-bars" id="rm4-bars"></ul>
          <p class="muted small" id="rm4-note"></p>
        </article>
      </div>
    </section>

    <!-- Everything else, folded -->
    <details class="fold">
      <summary><h2 data-i18n="fold_live"></h2></summary>
      <h3 data-i18n="station_title"></h3>
      <p class="muted small" id="station-text"></p>
      <div class="chart" id="chart-station"></div>
      <h3 data-i18n="raw_title"></h3>
      <p class="muted small" data-i18n="raw_text"></p>
      <div class="chart" id="chart-raw"></div>
      <div id="gtc-panel"></div>
    </details>

    <!-- Data to keep in mind: why these data, what is missing, limits -->
    <section id="notes">
      <h2 data-i18n="notes_title"></h2>
      <p class="muted" data-i18n="notes_intro"></p>
      <div class="notes-grid">
        <article class="note-card why"><h3 data-i18n="notes_why_title"></h3><ul data-i18n-html="notes_why"></ul></article>
        <article class="note-card missing"><h3 data-i18n="notes_missing_title"></h3><ul data-i18n-html="notes_missing"></ul></article>
        <article class="note-card limits"><h3 data-i18n="notes_limits_title"></h3><ul data-i18n-html="notes_limits"></ul></article>
      </div>
    </section>

    <details class="fold">
      <summary><h2 data-i18n="fold_refs"></h2></summary>
      <div class="prose" data-i18n-html="refs_html"></div>
    </details>
  </main>

  <footer class="wrap foot">
    <p id="updated" class="muted small"></p>
    <p class="muted small" data-i18n="footer"></p>
    <p class="muted small" data-i18n-html="credits"></p>
  </footer>

  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <script src="assets/i18n.js?v=32"></script>
  <script src="assets/charts.js?v=32"></script>
  <script src="assets/app.js?v=32"></script>
</body>
</html>
