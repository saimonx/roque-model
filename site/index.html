<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roque Night Forecast</title>
  <meta name="description" content="Tonight at the Roque de los Muchachos Observatory (La Palma), hour by hour: will the dome be open, and how sharp will the stars be. Independent project with real, public data.">
  <link rel="stylesheet" href="assets/style.css?v=9">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div>
        <h1>Roque Night Forecast</h1>
        <p class="sub" data-i18n="subtitle"></p>
      </div>
      <div class="controls">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="es">ES</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="theme" id="theme" data-i18n-title="theme" aria-label="theme">◐</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p class="notice" data-i18n="independent"></p>

    <!-- 1. Tonight: the answer -->
    <section id="tonight">
      <h2 id="night-title"></h2>
      <p class="muted small night-line"><span id="night-window"></span></p>
      <details class="info"><summary id="mode"></summary><p id="mode-text"></p></details>
      <p class="headline" id="headline"></p>
      <div class="strip" id="strip"></div>
      <p class="muted small" data-i18n-html="strip_legend"></p>

      <div class="facts">
        <div class="fact">
          <span class="fact-label" data-i18n="fact_seeing"></span>
          <span class="fact-value" id="seeing"></span>
          <div class="scale" aria-hidden="true"><div class="scale-bar"></div><div class="scale-mark" id="seeing-mark"></div></div>
          <span class="scale-ends small muted"><span>0,4″</span><span id="seeing-class"></span><span>2″</span></span>
          <span class="muted small" id="seeing-ref"></span>
        </div>
        <div class="fact">
          <span class="fact-label" data-i18n="fact_moon"></span>
          <span class="fact-value moon-value"><svg id="moon-icon" viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"></svg><span id="moon-pct"></span></span>
          <span class="muted small" id="moon-text"></span>
        </div>
        <div class="fact">
          <span class="fact-label" data-i18n="fact_usual"></span>
          <span class="fact-value" id="usual"></span>
          <span class="muted small" id="usual-text"></span>
        </div>
      </div>
    </section>

    <!-- 2. How we know, in three sentences -->
    <section>
      <h2 data-i18n="how_title"></h2>
      <ol class="steps" id="how"></ol>
    </section>

    <!-- Everything else, folded -->
    <details class="fold">
      <summary><h2 data-i18n="fold_real"></h2></summary>
      <p class="muted" data-i18n="real_intro"></p>
      <ul class="checks" id="checks"></ul>
      <div class="table-wrap"><table id="table-wht" class="small"></table></div>
    </details>

    <details class="fold">
      <summary><h2 data-i18n="fold_eval"></h2></summary>
      <p class="muted" data-i18n="eval_intro"></p>
      <div class="table-wrap"><table id="table-plain" class="text plain"></table></div>
      <p class="muted small" data-i18n="eval_note"></p>

      <h3 data-i18n="recent_title"></h3>
      <p class="muted small" data-i18n="recent_text"></p>
      <div class="chart" id="chart-recent"></div>

      <h3 data-i18n="reliability_title"></h3>
      <p class="muted small" data-i18n="reliability_text"></p>
      <div class="chart square" id="chart-reliability"></div>

      <h3 data-i18n="track_title"></h3>
      <p class="muted small" data-i18n="track_text"></p>
      <div class="table-wrap"><table id="table-track"></table></div>

      <details class="more">
        <summary data-i18n="technical"></summary>
        <div class="prose small" data-i18n-html="glossary"></div>
        <div class="table-wrap"><table id="table-tech"></table></div>
      </details>
    </details>

    <details class="fold">
      <summary><h2 data-i18n="fold_data"></h2></summary>
      <div class="data" data-i18n-html="data_html"></div>
    </details>

    <details class="fold">
      <summary><h2 data-i18n="fold_live"></h2></summary>
      <h3 data-i18n="station_title"></h3>
      <p class="muted small" id="station-text"></p>
      <div class="chart" id="chart-station"></div>
      <h3 data-i18n="raw_title"></h3>
      <p class="muted small" data-i18n="raw_text"></p>
      <div class="chart" id="chart-raw"></div>
      <div id="gtc-panel"></div>
    </details>

    <details class="fold">
      <summary><h2 data-i18n="fold_refs"></h2></summary>
      <div class="prose" data-i18n-html="refs_html"></div>
    </details>
  </main>

  <footer class="wrap foot">
    <p id="updated" class="muted small"></p>
    <p class="muted small" data-i18n="footer"></p>
  </footer>

  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <script src="assets/i18n.js?v=9"></script>
  <script src="assets/charts.js?v=9"></script>
  <script src="assets/app.js?v=9"></script>
</body>
</html>
