[project]
name = "roque-model"
version = "0.1.0"
description = "RoqueModel: hourly forecast of whether the telescope dome can open tonight at the Roque de los Muchachos Observatory (independent project)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17",
    "beautifulsoup4>=4.12",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "sentry-sdk>=2.73.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupytext>=1.19.6",
    "nbconvert>=7.17.2",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roque_forecast"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
