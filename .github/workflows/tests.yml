# Run the tests and the linter on every push and pull request.
# The tests use small real files in tests/fixtures/, so they need no downloads or data archive.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install the package and the development tools (versions from uv.lock)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Tests (pytest)
        run: uv run pytest -q
