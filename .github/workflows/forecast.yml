# Tonight's forecast, every hour, in the cloud: the same steps as scripts/update_tonight.sh on
# the Mac, then the page is published to the gh-pages branch (GitHub Pages).
name: Tonight's forecast

on:
  schedule:
    # Every 15 minutes, off the round hour. GitHub runs scheduled jobs when it has spare
    # capacity and skips many (with one run per hour, only 2 of 12 ran on 31 Oct), so several
    # chances per hour keep the page fresh.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:            # and by hand, from the Actions tab
  push:
    branches: [kick]            # and by the FIWARE server's hourly health check when the forecast is late
                                # (infra/cloud/monitor.py pushes one empty commit there with a deploy key)

permissions:
  contents: write               # to push the gh-pages branch and read the runtime release

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main             # always the current code, also when started from the kick branch

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install the package (same versions as uv.lock)
        run: uv sync --frozen --no-dev

      - name: Fetch RoqueModel and the tables it needs (runtime release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download runtime --pattern runtime.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/runtime.tar.gz"

      - name: Restore the forecast log from the published site
        run: |
          if git fetch --depth=1 origin gh-pages; then
            mkdir -p data/forecasts
            for f in issued.jsonl outcomes.jsonl; do
              if git show "FETCH_HEAD:forecasts/$f" > "$RUNNER_TEMP/$f"; then mv "$RUNNER_TEMP/$f" "data/forecasts/$f"; fi
            done
          fi

      - name: Restore the last good copy of each live source (used if a source is down)
        run: |
          if git rev-parse -q --verify FETCH_HEAD >/dev/null; then
            mkdir -p data/raw/tonight/last
            for f in $(git ls-tree --name-only FETCH_HEAD cache/ 2>/dev/null); do
              git show "FETCH_HEAD:$f" > "data/raw/tonight/last/$(basename "$f")"
            done
          fi

      - name: Tonight's forecast (also published to the FIWARE server, which Grafana reads)
        env:
          ROQUE_ORION_URL: https://178-105-253-255.sslip.io/orion
          ROQUE_QUANTUMLEAP_URL: https://178-105-253-255.sslip.io/ql
          ROQUE_FIWARE_TOKEN: ${{ secrets.ROQUE_FIWARE_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}       # errors to Sentry (src/roque_forecast/observability.py)
        run: uv run --no-dev python -m roque_forecast.tonight

      - name: Page evaluation
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: uv run --no-dev python -m roque_forecast.site_data

      - name: Publish to GitHub Pages
        env:
          PUBLISH_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: scripts/publish_site.sh
